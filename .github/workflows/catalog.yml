name: Update public catalog
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-publication
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'gearhubautoparts/gearhub-catalog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run sync
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
      - name: Publish catalog only
        run: |
          git config user.name 'GearHub catalog bot'
          git config user.email 'catalog@users.noreply.github.com'
          git add data/catalog.json data/sync-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public eBay catalog'
            git push origin HEAD:main
          fi
